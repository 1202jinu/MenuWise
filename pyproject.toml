[project]
name = "menuwise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "openai>=1.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[tool.fastapi]
entrypoint = "backend.backend_server:app"
